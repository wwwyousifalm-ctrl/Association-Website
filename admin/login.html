<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin login | Student Association, FMCS, University of Gezira</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/js/boot.js"></script>
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body class="auth-page admin-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="../index.html"
        ><img src="../assets/img/logo.png" alt="" width="34" height="42" /><span
          >Student Association<small>Admin area</small></span
        ></a
      >
      <div class="header-actions">
        <button
          type="button"
          class="theme-toggle"
          aria-label="Switch between light and dark mode"
        >
          Theme
        </button>
        <a class="btn btn-secondary" href="../index.html">Back to site</a>
      </div>
    </header>
    <main id="main">
      <section class="auth-card" aria-labelledby="admin-login-title">
        <h1 id="admin-login-title">Admin login</h1>
        <p>
          For committee members with an admin account. Admin access is granted
          by an existing admin from the Users page, so you cannot register here.
        </p>
        <div class="form-alert" role="alert" aria-live="assertive" hidden></div>
        <form
          id="admin-login-form"
          action="../api/auth/admin-login.php"
          method="post"
          novalidate
        >
          <input type="hidden" name="csrf_token" value="" />
          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="8"
            />
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <p class="field-inline">
            <input
              id="show-password"
              type="checkbox"
              data-toggle-password="password"
            />
            <label for="show-password">Show password</label>
          </p>
          <button class="btn" type="submit">Log in as admin</button>
        </form>
        <p>Not an admin? <a href="../login.html">Student login</a></p>
      </section>
    </main>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
